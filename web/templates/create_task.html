<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>新建爬虫任务 - CrawlerX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .card {
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .spider-option {
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .spider-option:hover {
            background-color: #f8f9fa;
            border-color: #0d6efd;
        }
        .spider-option.active {
            background-color: #e7f1ff;
            border-color: #0d6efd;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">CrawlerX 爬虫系统</a>
            <a class="btn btn-outline-light" href="/">
                <i class="bi bi-arrow-left"></i> 返回控制台
            </a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h2 class="mb-0"><i class="bi bi-plus-circle"></i> 新建爬虫任务</h2>
                    </div>
                    <div class="card-body">
                        <form id="create-task-form" action="/create_task" method="POST">
                            <!-- 爬虫类型选择 -->
                            <div class="mb-4">
                                <label class="form-label fw-bold">选择爬虫类型</label>
                                <div id="spider-options">
                                    <div class="spider-option" data-spider="basic">
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="spider" 
                                                   id="spider-basic" value="basic" checked>
                                            <label class="form-check-label fw-bold" for="spider-basic">
                                                <i class="bi bi-globe"></i> 基础HTTP爬虫
                                            </label>
                                        </div>
                                        <p class="text-muted mt-2 mb-0">
                                            使用HTTP请求获取网页内容，适合静态页面爬取
                                        </p>
                                    </div>
                                    
                                    <div class="spider-option" data-spider="selenium">
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="spider" 
                                                   id="spider-selenium" value="selenium">
                                            <label class="form-check-label fw-bold" for="spider-selenium">
                                                <i class="bi bi-browser-chrome"></i> Selenium浏览器爬虫
                                            </label>
                                        </div>
                                        <p class="text-muted mt-2 mb-0">
                                            使用真实浏览器渲染页面，适合JavaScript动态内容
                                        </p>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- URL列表 -->
                            <div class="mb-4">
                                <label class="form-label fw-bold">目标URL列表</label>
                                <textarea name="urls" class="form-control" rows="5" 
                                          placeholder="每行输入一个URL，例如：
https://example.com/page1
https://example.com/page2
https://example.com/page3" required></textarea>
                                <div class="form-text">每行输入一个完整的URL地址</div>
                            </div>
                            
                            <!-- 高级配置 -->
                            <div class="mb-4">
                                <a class="d-block mb-2 text-decoration-none" 
                                   data-bs-toggle="collapse" 
                                   href="#advanced-config">
                                    <i class="bi bi-gear"></i> 高级配置 <i class="bi bi-chevron-down"></i>
                                </a>
                                <div class="collapse" id="advanced-config">
                                    <div class="card card-body">
                                        <div class="mb-3">
                                            <label class="form-label">请求头 (JSON格式)</label>
                                            <textarea name="headers" class="form-control" rows="3" 
                                                      placeholder='{"User-Agent": "Custom User Agent", "Referer": "https://example.com"}'>
                                            </textarea>
                                            <div class="form-text">自定义HTTP请求头</div>
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label class="form-label">超时时间 (秒)</label>
                                            <input type="number" name="timeout" class="form-control" value="10" min="1">
                                        </div>
                                        
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" name="save_html" id="save-html">
                                            <label class="form-check-label" for="save-html">
                                                保存原始HTML
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="bi bi-play-fill"></i> 开始爬取
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 爬虫类型选择效果
        document.querySelectorAll('.spider-option').forEach(option => {
            const radio = option.querySelector('.form-check-input');
            
            option.addEventListener('click', () => {
                radio.checked = true;
                document.querySelectorAll('.spider-option').forEach(opt => {
                    opt.classList.remove('active');
                });
                option.classList.add('active');
            });
            
            if (radio.checked) {
                option.classList.add('active');
            }
        });
        
        // 表单提交处理
        document.getElementById('create-task-form').addEventListener('submit', function(e) {
            const urls = this.elements.urls.value.trim();
            if (!urls) {
                e.preventDefault();
                alert('请输入至少一个URL');
                return;
            }
            
            // 显示加载状态
            const btn = this.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> 正在创建任务...';
        });

    // 在现有脚本中添加JSON验证功能
    document.querySelector('textarea[name="headers"]').addEventListener('input', function() {
        const value = this.value.trim();
        if (!value) return;
        
        try {
            JSON.parse(value);
            this.classList.remove('is-invalid');
            document.getElementById('json-error').style.display = 'none';
        } catch (e) {
            this.classList.add('is-invalid');
            document.getElementById('json-error').style.display = 'block';
            document.getElementById('json-error').textContent = `JSON错误: ${e.message}`;
        }
    });
    
    // 在表单提交处理中添加验证
    document.getElementById('create-task-form').addEventListener('submit', function(e) {
        const urls = this.elements.urls.value.trim();
        if (!urls) {
            e.preventDefault();
            alert('请输入至少一个URL');
            return;
        }
        // 显示加载状态
        const btn = this.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> 正在创建任务...';
    });

    </script>


    <script>
    // 在表单提交时验证并格式化JSON
    document.getElementById('taskForm').addEventListener('submit', function(e) {
        const headersInput = document.getElementById('headers');
            try {
            // 空输入处理
            if (!headersInput.value.trim()) {
                headersInput.value = '{}';
            } else {
                // 自动修复常见格式错误
                const fixedJson = headersInput.value
                    .replace(/(\w+):/g, '"$1":')  // 键添加引号
                    .replace(/'/g, '"');           // 单引号转双引号
                
                // 验证并格式化
                const parsed = JSON.parse(fixedJson);
                    headersInput.value = JSON.stringify(parsed, null, 2);
            }
        } catch (error) {
            e.preventDefault();
                alert(`请求头JSON格式错误:\n${error.message}`);
        }
    });
    </script>
    <!-- 在headers文本域下方添加错误提示 -->
    <div id="json-error" class="invalid-feedback" style="display: none; color: #dc3545;">
          无效的JSON格式
    </div>
</body>
</html>
